# Figures cropped from the PDFs linked below: FA-RDP Fig. 1 (p. 1),
# IPR-1 Fig. 1 (CVPR version, p. 1), and RESBev Fig. 1(a) (v2, p. 2).
- title: "FA-RDP: A Frequency-Adaptive Reactive Diffusion Policy for Contact-Rich Manipulation"
  authors: "<strong>Lifeng Zhuo*</strong>, Wendi Chen*, Han Xue, Shirun Tang, Jun Lv, Cewu Lu, Chuan Wen"
  venue: "arXiv preprint, 2026"
  equal_contribution: true
  url: https://arxiv.org/abs/2607.28596
  pdf: /assets/pdf/papers/fa-rdp.pdf
  project: https://fa-rdp.github.io/
  image: /assets/img/papers/fa-rdp.png
  image_width: 744
  image_height: 492
  image_alt: "FA-RDP preserves diverse approach trajectories before contact and switches to rapid force feedback after contact."
  summary: "FA-RDP addresses the trade-off between diverse motion planning and rapid force feedback in contact-rich manipulation. A shared visual-force Transformer supports both low-frequency, multi-step diffusion sampling before contact and high-frequency, single-step control after contact. A learned multimodality indicator selects the appropriate frequency, while Manifold Consistency Distillation enables fast action prediction on the robot action manifold. Experiments on three manipulation tasks demonstrate improved success rates while preserving diverse pre-contact trajectories."

- title: "IPR-1: Interactive Physical Reasoner"
  authors: "Mingyu Zhang*, <strong>Lifeng Zhuo*</strong>, Tianxi Tan, Guocan Xie, Xian Nie, Yan Li, Renjie Zhao, Zizhu He, Ziyu Wang, Jiting Cai, Yong-Lu Li"
  venue: CVPR 2026
  equal_contribution: true
  url: https://arxiv.org/abs/2511.15407
  pdf: /assets/pdf/papers/ipr-1.pdf
  project: https://www.rhos.ai/research/ipr-1
  code: https://github.com/rhos-ai/IPR-1
  image: /assets/img/papers/ipr-1.png
  image_width: 714
  image_height: 432
  image_alt: "IPR-1 learns shared physical and causal mechanisms from over 1,000 games and transfers to unseen games."
  summary: "IPR-1 learns physical and causal reasoning through interaction with over 1,000 heterogeneous games. It combines a vision-language policy with world-model rollouts that anticipate action outcomes and guide reinforcement learning. A physics-centric action representation, PhysCode, connects semantic intent with physical dynamics. The model is evaluated from basic physical intuition to goal-directed reasoning, improves with more training games and interaction steps, and transfers to unseen games without additional training."

- title: "RESBev: Making BEV Perception More Robust"
  authors: "<strong>Lifeng Zhuo</strong>, Kefan Jin, Zhe Liu, Hesheng Wang"
  venue: "NeurIPS 2026"
  url: https://arxiv.org/abs/2603.09529
  pdf: /assets/pdf/papers/resbev.pdf
  image: /assets/img/papers/resbev.png
  image_width: 678
  image_height: 400
  image_alt: "RESBev predicts clean BEV features from temporal context and fuses them with corrupted features to restore perception."
  summary: "RESBev improves the robustness of bird's-eye-view perception by treating feature recovery as a latent semantic prediction problem. A temporal world model uses historical BEV observations and ego-motion to predict clean feature priors, which are fused with corrupted observations to reconstruct the scene representation. The module integrates into existing perception systems without changing their backbone. Experiments on nuScenes demonstrate improved resilience to natural sensor disturbances and adversarial attacks with limited fine-tuning."
